[project]
name = "devops-multi-agent"
version = "0.5.0"
description = "Multi-agent DevOps incident response system built with LangGraph and Google Gemini"
requires-python = ">=3.12"

dependencies = [
    "langgraph",
    "langchain",
    "langchain-google-genai",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "boto3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]